<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#skyGrad)"/>

  <!-- Road -->
  <rect x="0" y="300" width="800" height="200" fill="url(#roadGrad)"/>
  <rect x="0" y="295" width="800" height="10" fill="#888"/>

  <!-- Road markings -->
  <rect x="50" y="400" width="80" height="8" fill="#FFD700" rx="2"/>
  <rect x="200" y="400" width="80" height="8" fill="#FFD700" rx="2"/>
  <rect x="350" y="400" width="80" height="8" fill="#FFD700" rx="2"/>
  <rect x="500" y="400" width="80" height="8" fill="#FFD700" rx="2"/>
  <rect x="650" y="400" width="80" height="8" fill="#FFD700" rx="2"/>
  <!-- Center line -->
  <rect x="0" y="345" width="800" height="6" fill="#FFF" rx="3" opacity="0.5"/>

  <!-- Car 1 (red, crashed, tilted) -->
  <g transform="translate(220, 290) rotate(-12)">
    <rect x="0" y="20" width="120" height="55" fill="#CC2222" rx="8"/>
    <rect x="15" y="5" width="90" height="35" fill="#BB3333" rx="6"/>
    <rect x="20" y="8" width="35" height="28" fill="#a8d8ea" opacity="0.8" rx="3"/>
    <rect x="65" y="8" width="35" height="28" fill="#a8d8ea" opacity="0.8" rx="3"/>
    <circle cx="20" cy="75" r="14" fill="#222"/>
    <circle cx="20" cy="75" r="9" fill="#444"/>
    <circle cx="100" cy="75" r="14" fill="#222"/>
    <circle cx="100" cy="75" r="9" fill="#444"/>
    <!-- Damage crumple -->
    <rect x="0" y="20" width="30" height="55" fill="#AA1111" rx="4"/>
    <line x1="5" y1="20" x2="25" y2="70" stroke="#880000" stroke-width="3"/>
    <line x1="15" y1="20" x2="5" y2="70" stroke="#880000" stroke-width="2"/>
  </g>

  <!-- Car 2 (white, crashed) -->
  <g transform="translate(380, 285) rotate(8)">
    <rect x="0" y="20" width="130" height="58" fill="#EEEEEE" rx="8"/>
    <rect x="15" y="5" width="100" height="35" fill="#DDDDDD" rx="6"/>
    <rect x="20" y="8" width="40" height="27" fill="#a8d8ea" opacity="0.8" rx="3"/>
    <rect x="70" y="8" width="40" height="27" fill="#a8d8ea" opacity="0.8" rx="3"/>
    <circle cx="22" cy="78" r="14" fill="#222"/>
    <circle cx="22" cy="78" r="9" fill="#444"/>
    <circle cx="108" cy="78" r="14" fill="#222"/>
    <circle cx="108" cy="78" r="9" fill="#444"/>
    <!-- Front damage -->
    <rect x="100" y="20" width="30" height="58" fill="#CCC" rx="4"/>
    <line x1="105" y1="22" x2="125" y2="72" stroke="#AAA" stroke-width="3"/>
  </g>

  <!-- Car 3 (blue, stopped further) -->
  <g transform="translate(540, 300) rotate(3)">
    <rect x="0" y="20" width="110" height="52" fill="#2255AA" rx="8"/>
    <rect x="15" y="5" width="80" height="33" fill="#3366BB" rx="6"/>
    <rect x="18" y="8" width="32" height="24" fill="#a8d8ea" opacity="0.8" rx="3"/>
    <rect x="58" y="8" width="32" height="24" fill="#a8d8ea" opacity="0.8" rx="3"/>
    <circle cx="20" cy="72" r="13" fill="#222"/>
    <circle cx="90" cy="72" r="13" fill="#222"/>
  </g>

  <!-- Person 1 (standing near car 1) -->
  <g transform="translate(195, 340)">
    <circle cx="15" cy="8" r="8" fill="#FDBCB4"/>
    <rect x="8" y="16" width="14" height="22" fill="#3355AA" rx="3"/>
    <line x1="15" y1="18" x2="5" y2="30" stroke="#FDBCB4" stroke-width="4"/>
    <line x1="15" y1="18" x2="25" y2="28" stroke="#FDBCB4" stroke-width="4"/>
    <line x1="9" y1="38" x2="7" y2="52" stroke="#1a1a2e" stroke-width="4"/>
    <line x1="20" y1="38" x2="22" y2="52" stroke="#1a1a2e" stroke-width="4"/>
  </g>

  <!-- Person 2 (kneeling, near crash) -->
  <g transform="translate(340, 352)">
    <circle cx="12" cy="8" r="7" fill="#FDBCB4"/>
    <rect x="6" y="15" width="12" height="18" fill="#AA3322" rx="2"/>
    <line x1="12" y1="16" x2="2" y2="26" stroke="#FDBCB4" stroke-width="3"/>
    <line x1="12" y1="16" x2="22" y2="24" stroke="#FDBCB4" stroke-width="3"/>
    <line x1="8" y1="33" x2="4" y2="44" stroke="#222" stroke-width="3"/>
    <line x1="16" y1="33" x2="19" y2="44" stroke="#222" stroke-width="3"/>
  </g>

  <!-- Person 3 (on phone, further back) -->
  <g transform="translate(510, 345)">
    <circle cx="12" cy="8" r="7" fill="#D4A574"/>
    <rect x="6" y="15" width="12" height="20" fill="#225522" rx="2"/>
    <line x1="12" y1="16" x2="2" y2="26" stroke="#D4A574" stroke-width="3"/>
    <line x1="12" y1="16" x2="20" y2="22" stroke="#D4A574" stroke-width="3"/>
    <rect x="18" y="16" width="6" height="10" fill="#333" rx="1"/>
    <line x1="8" y1="35" x2="6" y2="48" stroke="#222" stroke-width="3"/>
    <line x1="15" y1="35" x2="17" y2="48" stroke="#222" stroke-width="3"/>
  </g>

  <!-- Debris / skid marks -->
  <ellipse cx="300" cy="330" rx="30" ry="8" fill="#333" opacity="0.5"/>
  <ellipse cx="350" cy="320" rx="20" ry="5" fill="#333" opacity="0.4"/>

  <!-- Emergency light flash effect -->
  <circle cx="260" cy="295" r="8" fill="#FF3333" opacity="0.9"/>
  <circle cx="250" cy="295" r="4" fill="#FF6666" opacity="0.7"/>

  <!-- Trees in background -->
  <g opacity="0.8">
    <rect x="80" y="230" width="12" height="60" fill="#6B4226"/>
    <ellipse cx="86" cy="220" rx="28" ry="35" fill="#2D6A4F"/>
    <rect x="720" y="225" width="12" height="65" fill="#6B4226"/>
    <ellipse cx="726" cy="215" rx="28" ry="35" fill="#2D6A4F"/>
    <rect x="650" y="235" width="10" height="55" fill="#6B4226"/>
    <ellipse cx="655" cy="228" rx="22" ry="28" fill="#40916C"/>
  </g>

  <!-- Warning sign overlay -->
  <g transform="translate(30, 20)">
    <polygon points="50,5 95,85 5,85" fill="#FF6B00" stroke="#333" stroke-width="2"/>
    <text x="50" y="70" text-anchor="middle" font-size="42" font-weight="bold" fill="#FFF">!</text>
  </g>

  <!-- Label -->
  <rect x="0" y="460" width="800" height="40" fill="rgba(0,0,0,0.6)"/>
  <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#FF8C00" font-weight="bold">⚠ DEMO SCENE — SIMULATED ROAD ACCIDENT — NOT A REAL EVENT</text>
</svg>
